name: Unzip
on: workflow_dispatch
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip files
        run: |
          ls -la
          unzip -o "opay (2).zip" || true
          for f in *.zip; do [ -e "$f" ] && unzip -o "$f" || true; done
      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Unzipped" || echo "nothing"
          git push
